

services:
  # 1. Our Database
  postgres:
    image: postgres:latest
    container_name: wallet-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: wallet_db
    ports:
      - "5432:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wallet_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      

  # 2. redis(Cache)
  redis:
    image: redis:latest
    container_name: wallet-redis
    ports:
      - "6379:6379"

  # 3. kafka (Message Broker)
  kafka:
    image: apache/kafka:latest
    container_name: wallet-kafka
    ports:
      - "9092:9092"

# 4. Wallet Core Service (Spring Boot Application)
  wallet-service:
    build: ./wallet-service
    container_name: wallet-app
    network_mode: host
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/wallet_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: secret
      SPRING_KAFKA_BOOTSTRAP_SERVERS: localhost:9092
      SPRING_DATA_REDIS_HOST: localhost
      SPRING_DATA_REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    