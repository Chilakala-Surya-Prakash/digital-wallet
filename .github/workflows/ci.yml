name: Digital Wallet CI Pipeline

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]


jobs:
    build-and-test:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory : ./wallet-service


        steps:
            - name: Checkout Repository code
              uses: actions/checkout@v5

            - name: Set up JDK 17 & Maven Cache
              uses: actions/setup-java@v5
              with:
                java-version: '17'
                distribution: 'temurin'
                cache: 'maven'
                cache-dependency-path: '**/pom.xml'

            - name: Grant Execute permission to Maven Wrapper
              run: chmod +x mvnw

            - name: Build and Run Unit & Slice Tests
              run: ./mvnw -B clean test

            - name: Verify Docker Image Build
              working-directory: ./wallet-service
              run: docker build -t digital-wallet-app:latest .

            - name: Deploy to AWS EC2
              if: github.ref == 'refs/heads/main' && github.event_name == 'push'
              uses: appleboy/ssh-action@v1.0.3
              with:
                host: ${{secrets.EC2_HOST}}
                username: ${{secrets.EC2_USERNAME}}
                key: ${{secrets.EC2_SSH_KEY}}
                script:
                  cd ~/digital-wallet
                  git fetch origin main
                  git reset --hard origin/main
                  docker compose up --build -d